<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>绿电采购与碳披露工作台</title>
<style>
  :root { --line:#d7dde5; --blue:#1f5fa8; --bg:#f6f8fa; --warn:#9a6700; --red:#b42318; --green:#1a7f37; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1f2933; background:var(--bg); }
  header { background:#10324f; color:#fff; padding:14px 22px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; opacity:.8; font-size:12px; }
  nav { display:flex; gap:4px; padding:0 16px; background:#173f63; flex-wrap:wrap; }
  nav button { background:none; border:0; color:#cfe0f2; padding:12px 16px; cursor:pointer; font-size:14px; border-bottom:3px solid transparent; }
  nav button.active { color:#fff; border-bottom-color:#7db6ef; }
  main { padding:20px 22px; max-width:1180px; margin:0 auto; }
  section.panel { display:none; background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; }
  section.panel.active { display:block; }
  h2 { font-size:16px; margin:0 0 12px; }
  h3 { font-size:14px; margin:18px 0 8px; color:#33414f; }
  label { display:block; font-size:12px; color:#51606e; margin:8px 0 3px; }
  input, select, textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  textarea { font-family:ui-monospace,monospace; min-height:110px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
  .row > div { flex:1; min-width:140px; }
  button.action { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:9px 18px; cursor:pointer; margin-top:12px; }
  button.ghost { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  table { border-collapse:collapse; width:100%; margin-top:10px; font-size:12.5px; }
  th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#eef2f6; }
  pre { background:#0f1b26; color:#d6e6f5; padding:14px; border-radius:8px; overflow:auto; font-size:12px; max-height:560px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
  .tag.ok { background:#daf3e1; color:var(--green); }
  .tag.warn { background:#fdf0d5; color:var(--warn); }
  .tag.bad { background:#fde3e0; color:var(--red); }
  .muted { color:#6b7785; font-size:12px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:12px 0; }
  .card { border:1px solid var(--line); border-radius:8px; padding:12px; background:#fbfcfd; }
  .card b { font-size:18px; }
</style>
</head>
<body>
<header>
  <h1>绿电采购与产品碳披露工作台</h1>
  <p>按 as-of 时点证据计算 · 规则编号可追认 · 客户视图自动脱敏 · 数据仅存本地事件日志</p>
</header>
<nav>
  <button data-tab="entry" class="active">月度录入</button>
  <button data-tab="disclosure">客户披露</button>
  <button data-tab="committee">采购委员会视图</button>
  <button data-tab="baseline">基期与分解</button>
  <button data-tab="revocation">撤销工作台</button>
</nav>
<main>
  <section class="panel active" id="panel-entry">
    <h2>月度录入（追加事件，不可改写历史）</h2>
    <div class="row">
      <div><label>数据表</label><select id="table-select"></select></div>
    </div>
    <div id="field-form" class="row"></div>
    <button class="action" id="submit-row">提交一条</button>
    <h3>或粘贴 CSV 批量录入（表头须与该表字段一致）</h3>
    <textarea id="csv-paste" placeholder="record,plant,phase,month,product,kg,kwh,known_month,source&#10;E7,A,forming,3,X,900,1700,3,direct"></textarea>
    <button class="action ghost" id="submit-csv">批量录入 CSV</button>
    <h3>从目录装载（如交接 fixtures 或月度目录）</h3>
    <div class="row"><div><label>服务器端目录路径</label><input id="folder-path" value="fixtures" /></div></div>
    <button class="action ghost" id="load-folder">装载目录</button>
    <div id="entry-result" class="muted"></div>
  </section>

  <section class="panel" id="panel-disclosure">
    <h2>客户披露查询</h2>
    <div class="row">
      <div><label>客户</label><input id="disc-client" value="C1" /></div>
      <div><label>as-of 月（披露时点）</label><input id="disc-asof" type="number" value="3" /></div>
    </div>
    <button class="action" id="run-disclosure">生成客户披露包（脱敏）</button>
    <div id="disclosure-cards"></div>
    <pre id="disclosure-json"></pre>
  </section>

  <section class="panel" id="panel-committee">
    <h2>采购委员会多维视图</h2>
    <div class="row"><div><label>as-of 月</label><input id="comm-asof" type="number" value="3" /></div></div>
    <button class="action" id="run-committee">查看全量结果</button>
    <div id="committee-summary"></div>
    <pre id="committee-json"></pre>
  </section>

  <section class="panel" id="panel-baseline">
    <h2>共用基期对比与强度变化分解</h2>
    <div class="row">
      <div><label>客户</label><input id="dec-client" value="C1" /></div>
      <div><label>当期 as-of 月</label><input id="dec-asof" type="number" value="3" /></div>
    </div>
    <button class="action" id="run-decomposition">解释覆盖 / 结构 / 强度变化</button>
    <div id="decomp-output"></div>
  </section>

  <section class="panel" id="panel-revocation">
    <h2>凭证撤销工作台（R16 双轨）</h2>
    <div class="row"><div><label>as-of 月</label><input id="rev-asof" type="number" value="3" /></div></div>
    <button class="action" id="run-revocation">区分待复核历史声明与新采购方案</button>
    <pre id="revocation-json"></pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const TABLES = await fetch('/api/tables').then(r => r.json());
const tableSelect = $('table-select');
tableSelect.innerHTML = Object.keys(TABLES).map(t => `<option>${t}</option>`).join('');
function renderFields() {
  const fields = TABLES[tableSelect.value] || [];
  $('field-form').innerHTML = fields.map(f => `<div><label>${f}</label><input name="${f}" placeholder="${f}" /></div>`).join('');
}
tableSelect.onchange = renderFields; renderFields();

async function post(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
  return r.json();
}
async function get(url) { return (await fetch(url)).json(); }
function tag(ok, text) { return `<span class="tag ${ok ? 'ok' : 'bad'}">${text}</span>`; }

$('submit-row').onclick = async () => {
  const values = {};
  $('field-form').querySelectorAll('input').forEach(i => { if (i.value) values[i.name] = i.value; });
  $('entry-result').textContent = JSON.stringify(await post('/api/rows', { table: tableSelect.value, values }), null, 2);
};
$('submit-csv').onclick = async () => {
  $('entry-result').textContent = JSON.stringify(await post('/api/rows-csv', { table: tableSelect.value, csv: $('csv-paste').value }), null, 2);
};
$('load-folder').onclick = async () => {
  $('entry-result').textContent = JSON.stringify(await post('/api/ingest-folder', { folder: $('folder-path').value }), null, 2);
};

document.querySelectorAll('nav button').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  $('panel-' + btn.dataset.tab).classList.add('active');
});

$('run-disclosure').onclick = async () => {
  const data = await get(`/api/disclosure?client=${encodeURIComponent($('disc-client').value)}&as_of=${$('disc-asof').value}`);
  $('disclosure-cards').innerHTML = (data.disclosures || []).map(d => `
    <div class="card">
      <div>${d.delivery} · ${d.product} · ${d.period}月 · ${d.kg}kg</div>
      <b>${d.carbon_intensity_g_per_kg ?? '—'} g CO₂/kg</b>
      <div>${tag(d.can_commit, d.can_commit ? '可承诺' : '不可直接承诺')}
           ${tag(!d.retraction_required, d.retraction_required ? '需回撤' : '无需回撤')}</div>
      <div class="muted">范围阶段：${(d.in_scope_phases || []).join('、') || '无'}</div>
      <div class="muted">default 标记电量：${d.default_marked_kwh} kWh</div>
    </div>`).join('');
  $('disclosure-json').textContent = JSON.stringify(data, null, 2);
};

$('run-committee').onclick = async () => {
  const data = await get(`/api/committee?as_of=${$('comm-asof').value}`);
  const cards = [
    ['分摊单元', data.allocations.length],
    ['无法归属项', data.unallocable.length],
    ['台账违规', data.ledger_violations.length],
    ['待复核撤销引用', data.revocation_review.reviews.length],
  ];
  $('committee-summary').innerHTML = `<div class="cards">${cards.map(([k,v]) => `<div class="card"><span class="muted">${k}</span><br><b>${v}</b></div>`).join('')}</div>`;
  $('committee-json').textContent = JSON.stringify(data, null, 2);
};

$('run-decomposition').onclick = async () => {
  const data = await get(`/api/decomposition?client=${encodeURIComponent($('dec-client').value)}&as_of=${$('dec-asof').value}`);
  if (data.error) { $('decomp-output').innerHTML = `<p class="tag bad">${data.error}</p>`; return; }
  const rows = (data.effects || []).map(e => `<tr><td>${e.effect}</td><td>${e.rule}</td><td>${e.g_per_kg ?? '—'}</td><td>${e.explanation}</td></tr>`).join('');
  const steps = (data.steps || []).map(s => `<tr><td>${s.label}</td><td>${s.value ?? '缺口'}</td></tr>`).join('');
  $('decomp-output').innerHTML = `
    <div class="cards">
      <div class="card"><span class="muted">基期强度</span><br><b>${data.baseline_intensity_g_per_kg ?? '—'}</b></div>
      <div class="card"><span class="muted">当期强度</span><br><b>${data.current_intensity_g_per_kg ?? '—'}</b></div>
      <div class="card"><span class="muted">总变化</span><br><b>${data.total_change_g_per_kg ?? '—'}</b></div>
      <div class="card"><span class="muted">未解释残差</span><br><b>${data.residual_g_per_kg ?? '—'}</b></div>
    </div>
    <h3>逐步分解（g CO₂/kg）</h3><table><tr><th>步骤</th><th>强度</th></tr>${steps}</table>
    <h3>效应解释</h3><table><tr><th>效应</th><th>规则</th><th>贡献</th><th>含义</th></tr>${rows}</table>
    <h3>缺口追踪（R18）</h3><pre>${JSON.stringify(data.gap_trace, null, 2)}</pre>`;
};

$('run-revocation').onclick = async () => {
  const data = await get(`/api/revocation?as_of=${$('rev-asof').value}`);
  $('revocation-json').textContent = JSON.stringify(data, null, 2);
};
</script>
</body>
</html>
